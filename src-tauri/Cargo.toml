[package]
name = "ruth-ide"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "crates/meta", "crates/core", "crates/api", "crates/store", "crates/term"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
ruth-meta = { path = "crates/meta" }
ruth-core = { path = "crates/core" }
ruth-api = { path = "crates/api" }
ruth-store = { path = "crates/store" }
ruth-term = { path = "crates/term" }
