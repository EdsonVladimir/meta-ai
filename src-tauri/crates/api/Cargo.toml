[package]
name = "ruth-api"
version = "0.1.0"
edition = "2021"

[dependencies]
ruth-core = { path = "../core" }
ruth-meta = { path = "../meta" }
ruth-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
